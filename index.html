<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#131b2d"><title>원더랜드 랜덤 디펜스</title><link rel="stylesheet" href="style.css"></head><body><main id="game"><header><div class="brand">♠ WONDERLAND <small>RANDOM DEFENSE</small></div><button id="help" aria-label="도움말">?</button><button id="sound" aria-label="사운드">♪</button></header><section id="stats"><span>🌙 <b id="wave">1</b> 웨이브</span><span>💎 <b id="gems">14</b></span><span>🪙 <b id="gold">60</b></span><span>❤️ <b id="life">25</b></span></section><section id="boss"><div id="bosslabel">다음 보스: 5 웨이브</div><div class="meter"><i id="bossbar"></i></div></section><div id="stage"><canvas id="board" aria-label="원더랜드 전투 필드"></canvas><div id="announcement"></div><div id="roundflag">WAVE 1</div></div><section id="roster"><div class="section-title">나의 수호자 <span id="count">0 / 18</span><button id="auto">자동 소환 OFF</button></div><div id="cards"></div></section><footer><div class="actions"><button id="summon" class="primary">🎲 소환 <small>💎 2</small></button><button id="merge">✨ 합성 <small>동일 3개</small></button><button id="upgrade">⚔ 강화 <small id="upgradeCost">🪙 30</small></button><button id="spell">🌀 마법 <small id="spellCost">준비 완료</small></button></div><div class="subactions"><button id="speed">⏩ 1배속</button><button id="pause">⏸ 일시정지</button><button id="codex">📖 도감</button><button id="reset">↻ 새 게임</button></div></footer><div id="modal" class="hidden"><div class="panel"><button id="close">✕</button><div id="modalBody"></div></div></div><div id="toast" role="status"></div></main><script src="game.js"></script></body></html>
