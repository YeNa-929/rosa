<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#181323">
  <title>원더랜드 랜덤 디펜스</title>
  <link rel="stylesheet" href="style.css?v=zunda-expedition">
  <script defer src="art.js?v=moonlit-rose-court"></script>
  <script defer src="audio.js?v=battle-score-2"></script>
  <script defer src="game.js?v=title-screen-1"></script>
</head>
<body>
  <main id="game">
    <header>
      <span class="crest" aria-hidden="true">♠</span>
      <h1>Wonderland <small>원더랜드 랜덤 디펜스</small></h1>
      <button id="help" aria-label="게임 방법" aria-haspopup="dialog">?</button>
      <button id="sound" aria-label="음악과 효과음" aria-pressed="false">♪</button>
    </header>
    <section id="stats" aria-label="전투 현황">
      <div class="stat wave"><span>웨이브</span><b id="wave">1</b></div>
      <div class="stat gems"><span>보석</span><b id="gems">14</b></div>
      <div class="stat gold"><span>골드</span><b id="gold">60</b></div>
      <div class="stat life"><span>생명</span><b id="life">25</b></div>
    </section>
    <section id="boss" aria-label="보스 현황">
      <div id="bosslabel">다음 보스 · 웨이브 5</div>
      <div class="meter"><i id="bossbar"></i></div>
    </section>
    <div id="stage">
      <canvas id="board" aria-label="달빛 장미 정원 전투 필드"></canvas>
      <div class="stage-caption"><span>달빛 장미 정원</span><span id="roundflag">전투 중</span></div>
      <div id="announcement" role="status"></div>
      <div id="toast" role="status"></div>
    </div>
    <section id="roster" aria-label="나의 수호자">
      <div class="section-title">나의 수호자 <span id="count">0 / 18</span><button id="auto" type="button" aria-pressed="false">자동 소환 <span id="autoStatus">OFF</span></button></div>
      <div id="cards"></div>
    </section>
    <footer>
      <div class="actions">
        <button id="summon" class="primary"><span aria-hidden="true">✦</span> 소환 <small>보석 2</small></button>
        <button id="merge"><span aria-hidden="true">❖</span> 합성 <small>동일 3명</small></button>
        <button id="upgrade"><span aria-hidden="true">↟</span> 강화 <small id="upgradeCost">골드 30</small></button>
        <button id="spell"><span aria-hidden="true">☾</span> 마법 <small id="spellCost">준비 완료</small></button>
      </div>
      <div class="subactions">
        <button id="speed">1배속</button>
        <button id="pause" aria-pressed="false">일시정지</button>
        <button id="codex" aria-haspopup="dialog">도감</button>
        <button id="reset">새 게임</button>
      </div>
      <div class="mode-link"><a href="./">로사 원정대 플레이</a></div>
    </footer>
    <dialog id="modal" aria-labelledby="modalTitle">
      <div class="panel">
        <button id="close" aria-label="닫기" autofocus>×</button>
        <div id="modalBody"></div>
      </div>
    </dialog>
  </main>
</body>
</html>
